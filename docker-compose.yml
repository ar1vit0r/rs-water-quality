services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rsw
      POSTGRES_PASSWORD: rsw
      POSTGRES_DB: rsw
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsw"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d
