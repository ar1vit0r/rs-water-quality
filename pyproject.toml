[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs-water-quality"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: tests that require a running Postgres (set TEST_DATABASE_URL)",
]
